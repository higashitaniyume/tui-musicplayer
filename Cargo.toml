[package]
name = "tui-musicplayer"
version = "0.1.0"
edition = "2024"
description = "A cross-platform terminal music player built with ratatui + rodio"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = { version = "0.20", features = ["symphonia-all"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
walkdir = "2"
dirs = "5"
roxmltree = "0.20"
